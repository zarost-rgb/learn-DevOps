---Щ
- name: Configure LAMP server
  hosts: local

  vars:
    apache_domain: lamp.local
    apache_document_root: /var/www/lamp.local
    mysql_db_name: lamp_db
    mysql_user: lamp_user
    mysql_password: lamp_password
    php_test_file_path: "{{ apache_document_root }}/info.php"

  pre_tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
      become: yes
      when: ansible_os_family == "Debian"
      tags: [system, update]

  roles:
    - role: apache
      tags: [apache, web]
    - role: mysql
      tags: [mysql, database]
    - role: php
      tags: [php, web]

  post_tasks:
    - name: Create index.html
      copy:
        content: |
          <!DOCTYPE html>
          <html>
          <head>
            <title>LAMP Stack Test</title>
          </head>
          <body>
            <h1>LAMP Stack is working!</h1>
            <p>This server was configured using Ansible roles.</p>
            <p><a href="info.php">PHP Info</a></p>
          </body>
          </html>
        dest: "{{ apache_document_root }}/index.html"
        owner: www-data
        group: www-data
        mode: 0644
      become: yes
      tags: [web, content]

    - name: Add host entry for local testing
      lineinfile:
        path: /etc/hosts
        line: "127.0.0.1 {{ apache_domain }}"
        state: present
      become: yes
      tags: [system, network]
